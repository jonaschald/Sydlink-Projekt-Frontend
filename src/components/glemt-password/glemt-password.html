<div class="glemt-password-page">

  <button
    class="back-button"
    type="button"
    (click)="tilbage()"
  >
    ← Tilbage
  </button>


  <div class="password-box">

    <h1>Glemt Password</h1>

    <h2>Opret nyt kodeord</h2>


    <label for="email">
      E-mail:
    </label>

    <input
      id="email"
      type="email"
      placeholder="E-mail..."
      [(ngModel)]="email"
    >


    <label for="nytKodeord">
      Nyt kodeord:
    </label>

    <input
      id="nytKodeord"
      type="password"
      placeholder="Nyt kodeord..."
      [(ngModel)]="nytKodeord"
    >


    <label for="gentagKodeord">
      Gentag kodeord:
    </label>

    <input
      id="gentagKodeord"
      type="password"
      placeholder="Gentag kodeord..."
      [(ngModel)]="gentagKodeord"
    >


    <button
      class="save-button"
      type="button"
      (click)="gemKodeord()"
    >
      Gem kodeord
    </button>

  </div>

</div>

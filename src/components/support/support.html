<style xmlns="http://www.w3.org/1999/html">
  .tilbage-container {
    top: 10px;
    left: 10px;

    position: absolute;
  }

  .tilbage-knap {
    display: flex;
    flex-direction: row;
    padding: 5px;
  }

  .tilbage-knap img {
    margin-right: 10px;
  }

  .support-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    width: auto;
    padding: 40px;

    background: wheat;
    display: flex;
    flex-direction: column;
    align-items: center;

    border-radius: 10px;
    border: 1px solid #ccc;
  }

  .support-container h3 {
    margin-bottom: 5px;
  }

  .form input,
  .form textarea {
    width: 100%;
  }

  .form textarea {
    width: 600px;
    height: 200px;
  }

  .send {
    padding: 4px;
  }
</style>

<header>
  <div class="tilbage-container">

    <button class="tilbage-knap">
      <img ngSrc="/resources/images/back-arrow-icon.svg" alt="<-" height="16" width="16">
      Tilbage
    </button>

  </div>
</header>
<body>
  <div class="support-container">

    <h1 class="Titel">
      Kontakt SydLink
    </h1>

    <div class="form">

  <!--    Navn form-->
      <h3>
        Navn: <span style="color: red"><sup>*</sup></span>
      </h3>

      <input type="text" class="navn-input" title="Indtast dit navn her" placeholder="Navn her...">

  <!--    Email form-->
      <h3>
        E-mail: <span style="color: red"><sup>*</sup></span>
      </h3>

      <input type="email" class="email-input" title="Indtast din email her" placeholder="Email her...">

  <!--    Titel form-->
      <h3>
        Titel: <span style="color: red"><sup>*</sup></span>
      </h3>

      <input type="text" class="titel-input" title="Indtast titlen af dit subjekt her" placeholder="Titel her...">

  <!--    Sagsnummer form-->
      <h3>
        Sagsnummer: <span style="color: red"><sup>*</sup></span>
      </h3>

      <input type="text" class="sagsnummer-input" title="Indtast dit sagsnummer her" placeholder="Sagsnummer her...">

  <!--    Beskrivelse form-->
      <div class="beskrivelses-form">
        <h3>
          Beskrivelse: <span style="color: red"><sup>*</sup></span>
        </h3>

        <textarea class="beskrivelse-input"
                  title="Beskriv hvorfor du vil kontake os her"
                  placeholder="Beskrivelse her..."></textarea>
      </div>

    </div>

    <button class="send" style="margin-top: 20px">
      Send
    </button>

  </div>
</body>
